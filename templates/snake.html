{% extends "base.html" %}

{% block content %}
<section class="panel game-panel narrow">
    <div class="game-head">
        <p class="eyebrow">Snake</p>
        <h1>贪吃蛇</h1>
        <p class="lead">吃苹果变长，每 50 分速度加快一点，别撞墙也别咬到自己。</p>
    </div>

    <div class="hud">
        <div class="score"><span>得分</span><b id="sScore">0</b></div>
        <div class="hud-buttons">
            <button class="btn small cream" id="sPause" type="button">暂停</button>
            <button class="btn small" id="sRestart" type="button">重开</button>
        </div>
        <div class="score"><span>最高分</span><b id="sBest">0</b></div>
    </div>

    <div class="frame">
        <canvas id="snake" width="600" height="600" data-state="idle" aria-label="贪吃蛇游戏画面"></canvas>
        <div class="overlay" id="sOverlay">
            <p class="ov-title" id="sTitle">贪吃蛇</p>
            <p class="ov-sub" id="sSub">方向键 / WASD 控制，吃苹果变长</p>
            <button class="btn green" id="sStart" type="button">开始游戏</button>
        </div>
    </div>

    <div class="dpad" aria-label="方向控制">
        <button type="button" class="up" data-dir="up" aria-label="上">▲</button>
        <button type="button" class="left" data-dir="left" aria-label="左">◀</button>
        <button type="button" class="down" data-dir="down" aria-label="下">▼</button>
        <button type="button" class="right" data-dir="right" aria-label="右">▶</button>
    </div>

    <div class="keys">
        <span><kbd>方向键</kbd> / <kbd>WASD</kbd> 转向</span>
        <span><kbd>空格</kbd> 暂停 / 继续</span>
        <span><kbd>Enter</kbd> 重新开始</span>
        <span class="chip">速度 <b id="sSpeed">1</b></span>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/snake.js') }}"></script>
{% endblock %}
